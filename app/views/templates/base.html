<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Taşıyıcı Seçimi{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='pico.min.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='city-autocomplete.js') }}" defer></script>
  <style>
    :root { --pico-font-size: 95%; }
    nav { border-bottom: 1px solid var(--pico-muted-border-color); margin-bottom: 1.5rem; }
    table td, table th { vertical-align: top; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; font-size: .8rem; white-space: nowrap; }
    .badge.ok { background: #e3f5e8; color: #1d6b34; }
    .badge.warn { background: #fff3d6; color: #8a5a00; }
    .badge.bad { background: #fde4e4; color: #9b1c1c; }
    .badge.info { background: #e6eefc; color: #1f4fa3; }
    .muted { color: var(--pico-muted-color); font-size: .85rem; }
    .error { color: #b42318; font-size: .85rem; margin-top: -.6rem; margin-bottom: .8rem; display: block; }
    .actions { display: flex; gap: .4rem; }
    .actions button { padding: .25rem .6rem; margin: 0; font-size: .85rem; }
    fieldset.inline label { display: inline-flex; margin-right: 1rem; }
    .htmx-request { opacity: .6; transition: opacity .2s; }
    pre.explanation { white-space: pre-wrap; font-family: inherit; }
    /* City suggestions (_city_input.html, static/city-autocomplete.js) */
    .city-box { position: relative; margin-bottom: var(--pico-spacing); }
    .city-box > input { margin-bottom: 0; }
    .city-box[data-loading]::after { content: "aranıyor…"; position: absolute; right: .9rem; top: 50%;
      transform: translateY(-50%); font-size: .75rem; color: var(--pico-muted-color); pointer-events: none; }
    .city-list { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; margin: 0; padding: .3rem 0;
      min-width: 100%; width: max-content; max-width: min(24rem, calc(100vw - 2rem));
      list-style: none; background: var(--pico-dropdown-background-color); color: var(--pico-dropdown-color);
      border: 1px solid var(--pico-dropdown-border-color); border-radius: var(--pico-border-radius);
      box-shadow: var(--pico-dropdown-box-shadow); }
    .city-list li { list-style: none; display: flex; align-items: center; gap: .5rem; margin: 0; padding: .45rem .8rem; }
    .city-list li[role="option"] { cursor: pointer; }
    .city-list li[role="option"]:hover, .city-list li[aria-selected="true"] { background: var(--pico-dropdown-hover-background-color); }
    .city-list li[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--pico-primary); }
    .city-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .city-name strong { font-weight: 700; }
    .city-state { min-width: 1.6rem; text-align: right; font-size: .8rem; color: var(--pico-muted-color); }
    .city-tag { font-size: .65rem; letter-spacing: .04em; padding: 0 .4rem; border-radius: 1rem;
      border: 1px solid currentColor; color: var(--pico-primary); opacity: .85; }
    .city-list li.city-note { font-size: .8rem; color: var(--pico-muted-color); }
    .city-list li.city-note.warn { color: #8a5a00; }
    .city-list li[role="option"] + li.city-note { border-top: 1px solid var(--pico-muted-border-color); margin-top: .2rem; }
  </style>
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>Taşıyıcı Seçimi</strong></li></ul>
      <ul>
        <li><a href="/admin/carriers">Firmalar</a></li>
        <li><a href="/admin/quote">Teklif</a></li>
        <li><a href="/admin/rules">Kurallar</a></li>
        <li><a href="/docs">API</a></li>
      </ul>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
