<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Taşıyıcı Seçimi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', path='pico.min.css') }}">
  <style>
    body { min-height: 100svh; display: grid; place-items: center; padding: 1rem; }
    main.login { width: 100%; max-width: 24rem; padding: 0; }
    main.login article { margin: 0; }
    main.login h1 { font-size: 1.4rem; margin-bottom: .3rem; }
    main.login p.muted { color: var(--pico-muted-color); font-size: .9rem; margin-bottom: 1.4rem; }
    .login-error { color: #b42318; background: rgba(180, 35, 24, .1); border-radius: var(--pico-border-radius);
      padding: .55rem .8rem; font-size: .9rem; margin-bottom: 1rem; }
    @media (prefers-color-scheme: dark) { .login-error { color: #ff9b91; } }
  </style>
</head>
<body>
  <main class="login">
    <article>
      <h1>Taşıyıcı Seçimi</h1>
      <p class="muted">Devam etmek için giriş yapın.</p>
      {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label>E-posta
          <input type="email" name="email" value="{{ email }}" autocomplete="username" required
                 {% if not email %}autofocus{% endif %}>
        </label>
        <label>Şifre
          <input type="password" name="password" autocomplete="current-password" required
                 {% if email %}autofocus{% endif %}>
        </label>
        <button type="submit">Giriş yap</button>
      </form>
    </article>
  </main>
</body>
</html>
