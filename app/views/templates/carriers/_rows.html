{#- Out of band (after a save) the rows travel inside <template>: the response starts with the message <p>, and
    the HTML parser drops <tbody>/<tr>/<td> tags that follow it, leaving only their text. #}
{% if oob %}<template>{% endif %}
<tbody id="carrier-rows"{% if oob %} hx-swap-oob="true"{% endif %}>
{% for c in carriers %}
  <tr id="carrier-{{ c.id }}">
    <td><strong>{{ c.name }}</strong></td>
    <td>{{ c.hq_city }}</td>
    <td>
      {%- if c.min_miles is none and c.max_miles is none -%}Sınırsız
      {%- elif c.min_miles is none -%}≤ {{ c.max_miles | miles }} mil
      {%- elif c.max_miles is none -%}≥ {{ c.min_miles | miles }} mil
      {%- else -%}{{ c.min_miles | miles }}–{{ c.max_miles | miles }} mil{%- endif -%}
    </td>
    <td>{{ c.container_sizes | sort | join(", ") }} ft</td>
    <td>{{ c.cargo_types | sort | join(", ") }}</td>
    <td>{{ c.rate_per_mile | rate }}</td>
    <td>
      {% if c.description %}<span class="muted">{{ c.description }}</span><br>{% endif %}
      {#- The same rule as the quotes: the saved probability against today's threshold. #}
      {% if c.description and c.note_status == "unchecked" %}
        <span class="badge bad">Kontrol edilmedi</span>
      {% elif c.note_uncertain(auto_accept) %}
        <span class="badge info" title="Jev emin değil; açıklama siparişlerde kontrol edilecek">Belirsiz · {{ "%.2f" | format(c.note_confidence) }}</span>
      {% elif c.note_may_restrict(auto_accept) %}
        <span class="badge warn" title="Jev: kısıt olasılığı">Kısıt içeriyor{% if c.note_confidence is not none %} · {{ "%.2f" | format(c.note_confidence) }}{% endif %}</span>
      {% elif c.description %}
        <span class="badge ok">Kısıt yok</span>
      {% endif %}
    </td>
    <td class="actions">
      <button class="secondary outline" hx-get="/admin/carriers/{{ c.id }}/edit" hx-target="#editor">Düzenle</button>
      <button class="contrast outline" hx-delete="/admin/carriers/{{ c.id }}" hx-target="#carrier-{{ c.id }}"
              hx-swap="outerHTML" hx-confirm="{{ c.name }} silinsin mi?">Sil</button>
    </td>
  </tr>
{% else %}
  <tr><td colspan="8" class="muted">Henüz firma yok.</td></tr>
{% endfor %}
</tbody>
{% if oob %}</template>{% endif %}
